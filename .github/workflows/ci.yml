name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is checked by the release workflow

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Renderer libraries are devDependencies bundled into the app, so audit everything.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run site
