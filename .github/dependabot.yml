version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop # main only takes release/hotfix merges (each push to main releases)
    schedule:
      interval: weekly
    groups:
      sdks:
        patterns: ["@anthropic-ai/*", "@openai/*", "@modelcontextprotocol/*", "zod"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop # main only takes release/hotfix merges (each push to main releases)
    schedule:
      interval: weekly
